<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tavern Dashboard app icon: an original brass-rimmed tankard by the hearth. No game logos. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2f1c"/>
      <stop offset="1" stop-color="#1c1612"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c2581c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1c1612" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d896"/>
      <stop offset="0.45" stop-color="#e0a84a"/>
      <stop offset="1" stop-color="#855810"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a22"/>
      <stop offset="0.35" stop-color="#b8763a"/>
      <stop offset="0.7" stop-color="#8a5428"/>
      <stop offset="1" stop-color="#4e2e14"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e6cc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#wood)"/>
  <!-- plank seams -->
  <g stroke="#000" stroke-opacity="0.18" stroke-width="6">
    <line x1="100" y1="372" x2="924" y2="372"/>
    <line x1="100" y1="648" x2="924" y2="648"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <!-- brass frame -->
  <rect x="128" y="128" width="768" height="768" rx="160" fill="none" stroke="url(#brass)" stroke-width="22"/>
  <rect x="150" y="150" width="724" height="724" rx="142" fill="none" stroke="#1c1612" stroke-opacity="0.6" stroke-width="4"/>

  <g filter="url(#shadow)">
    <!-- handle -->
    <path d="M664 430 C 790 430, 790 650, 664 650" fill="none" stroke="url(#brass)" stroke-width="46" stroke-linecap="round"/>
    <!-- body -->
    <path d="M352 390 L672 390 L652 714 Q650 742 622 742 L402 742 Q374 742 372 714 Z" fill="url(#mug)"/>
    <!-- staves -->
    <g stroke="#2b1a0c" stroke-opacity="0.45" stroke-width="5">
      <line x1="430" y1="400" x2="438" y2="736"/>
      <line x1="512" y1="400" x2="512" y2="738"/>
      <line x1="594" y1="400" x2="586" y2="736"/>
    </g>
    <!-- brass bands -->
    <path d="M356 448 L668 448 L665 492 L359 492 Z" fill="url(#brass)"/>
    <path d="M366 636 L658 636 L655 680 L369 680 Z" fill="url(#brass)"/>
    <!-- foam -->
    <path d="M330 400 Q330 330 400 336 Q420 282 482 300 Q520 262 572 296 Q640 280 660 340 Q712 348 700 404 Z" fill="url(#foam)"/>
    <circle cx="470" cy="372" r="10" fill="#efe3cb"/>
    <circle cx="590" cy="360" r="8" fill="#efe3cb"/>
  </g>
  <!-- embers -->
  <g fill="#ffb547">
    <circle cx="284" cy="300" r="9" opacity="0.8"/>
    <circle cx="756" cy="262" r="7" opacity="0.7"/>
    <circle cx="246" cy="560" r="6" opacity="0.55"/>
    <circle cx="790" cy="772" r="8" opacity="0.6"/>
  </g>
</svg>
