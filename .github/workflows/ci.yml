name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generates the route types that `tsc` needs on a fresh checkout.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
